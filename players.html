
<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Danh Bạ VĐV & Điểm Trình - Bính Dần 1986</title>
  <link rel="icon" type="image/jpeg" href="logo.jpg" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body {
      background-color: #0c0908;
      background-image:
        radial-gradient(circle at 15% 0%, rgba(234, 88, 12, 0.16), transparent 45%),
        radial-gradient(circle at 85% 10%, rgba(16, 185, 129, 0.08), transparent 40%);
      color: #f5f0eb;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .fire-card {
      background: linear-gradient(145deg, #17110e 0%, #110d0b 100%);
      border: 1px solid rgba(249, 115, 22, 0.3);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.45);
    }
    .fire-btn { background: linear-gradient(135deg, #f97316, #dc2626); }
    .fire-btn:active { transform: scale(0.97); }
    .fire-gradient-text {
      background: linear-gradient(90deg, #fbbf24, #f97316, #ef4444);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .ios-glass-nav {
      background: rgba(24, 17, 14, 0.75);
      backdrop-filter: blur(22px) saturate(180%);
      -webkit-backdrop-filter: blur(22px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.65), inset 0 1px 1px rgba(255, 255, 255, 0.18);
    }
  </style>
</head>
<body class="min-h-screen pb-28">

  <!-- HEADER -->
  <header class="sticky top-0 z-30 bg-[#0c0908]/90 backdrop-blur-md border-b border-orange-500/30 px-3.5 py-2.5">
    <div class="max-w-4xl mx-auto flex items-center justify-between gap-2">
      <div class="flex items-center gap-2.5 min-w-0">
        <img src="logo.jpg" onerror="this.style.display='none'" class="w-9 h-9 rounded-xl object-cover border border-orange-500/60 bg-black shrink-0" alt="Logo" />
        <div class="min-w-0">
          <h1 class="font-black text-sm uppercase tracking-wider truncate fire-gradient-text">Điểm Trình VĐV</h1>
          <p class="text-[11px] text-amber-200/60 truncate">CLB Bính Dần 1986 • Rating</p>
        </div>
      </div>
      <div class="flex items-center gap-1.5 shrink-0">
        <button id="btnAdminMode" onclick="toggleAdminMode()" class="whitespace-nowrap text-[11px] font-bold px-3 py-1.5 rounded-full bg-orange-500/15 border border-orange-500/40 text-orange-300">
          🔒 Quản lý
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-4xl mx-auto p-4 space-y-4">

    <!-- CÔNG CỤ KIỂM TRA TỔNG TRÌNH GHÉP CẶP -->
    <section class="fire-card rounded-2xl p-4 space-y-3">
      <div class="flex items-center justify-between">
        <h2 class="font-black text-orange-400 uppercase text-xs flex items-center gap-1.5">
          <i data-lucide="calculator" class="w-4 h-4"></i> Kiểm tra tổng trình ghép cặp
        </h2>
        <div class="flex items-center gap-1.5 text-xs">
          <span class="text-amber-200/60">Giới hạn:</span>
          <input id="inpMaxRating" type="number" step="0.1" value="5.5" oninput="checkPairRating()" class="w-16 bg-[#0c0908] border border-orange-500/40 rounded-lg px-2 py-1 text-center font-black text-amber-300 outline-none" />
        </div>
      </div>
      <div class="grid grid-cols-2 gap-2">
        <select id="selPair1" onchange="checkPairRating()" class="bg-[#0c0908] border border-gray-700 rounded-xl px-2.5 py-2 text-xs"></select>
        <select id="selPair2" onchange="checkPairRating()" class="bg-[#0c0908] border border-gray-700 rounded-xl px-2.5 py-2 text-xs"></select>
      </div>
      <div id="pairResult" class="hidden rounded-xl px-3 py-2 text-xs font-bold flex items-center justify-between"></div>
    </section>

    <!-- KHUNG THÊM VĐV (CHỈ HIỆN KHI MỞ KHÓA ADMIN) -->
    <section id="adminAddBox" class="hidden fire-card rounded-2xl p-4 space-y-3 border-emerald-500/40">
      <div class="flex items-center justify-between">
        <h2 class="font-black text-emerald-400 uppercase text-xs">+ Thêm / Cập nhật VĐV</h2>
        <button onclick="seedSamplePlayers()" class="text-[11px] px-2.5 py-1 rounded-lg bg-white/10 text-amber-200 font-semibold">Nạp 8 VĐV mẫu</button>
      </div>
      <div class="grid grid-cols-2 sm:grid-cols-4 gap-2">
        <input id="inpName" type="text" placeholder="Họ tên VĐV" class="col-span-2 bg-[#0c0908] border border-gray-700 rounded-xl px-3 py-2 text-xs outline-none focus:border-orange-500" />
        <select id="inpGender" class="bg-[#0c0908] border border-gray-700 rounded-xl px-2.5 py-2 text-xs">
          <option value="Nam">Nam</option>
          <option value="Nữ">Nữ</option>
        </select>
        <input id="inpRating" type="number" step="0.1" min="1.5" max="6.0" value="2.8" placeholder="Trình (VD: 2.8)" class="bg-[#0c0908] border border-gray-700 rounded-xl px-3 py-2 text-xs outline-none focus:border-orange-500" />
      </div>
      <div class="grid grid-cols-2 gap-2">
        <input id="inpClub" type="text" placeholder="CLB (VD: Bính Dần 1986)" value="Bính Dần 1986" class="bg-[#0c0908] border border-gray-700 rounded-xl px-3 py-2 text-xs outline-none" />
        <button onclick="addPlayer()" class="fire-btn py-2 rounded-xl font-black text-xs text-white">Lưu VĐV</button>
      </div>
    </section>

    <!-- TÌM KIẾM & LỌC -->
    <section class="flex gap-2">
      <input id="inpSearch" type="text" oninput="renderPlayers()" placeholder="🔍 Tìm tên VĐV hoặc CLB..." class="flex-1 bg-[#17110e] border border-orange-500/30 rounded-xl px-3.5 py-2.5 text-xs outline-none focus:border-orange-500" />
      <select id="filterGender" onchange="renderPlayers()" class="bg-[#17110e] border border-orange-500/30 rounded-xl px-3 py-2.5 text-xs font-bold text-amber-200">
        <option value="ALL">Tất cả</option>
        <option value="Nam">Nam</option>
        <option value="Nữ">Nữ</option>
      </select>
    </section>

    <!-- DANH SÁCH VĐV -->
    <section class="space-y-2">
      <div class="flex justify-between items-center text-[11px] text-amber-200/60 px-1">
        <span>Tổng số: <b id="totalPlayersCount" class="text-orange-400">0</b> VĐV</span>
        <span>Sắp xếp theo Điểm trình giảm dần</span>
      </div>
      <div id="playersList" class="space-y-2"></div>
    </section>

  </main>

  <!-- FLOATING LIQUID GLASS NAV -->
  <div class="fixed bottom-3 left-3 right-3 z-40 flex justify-center pointer-events-none">
    <nav class="ios-glass-nav pointer-events-auto w-full max-w-md rounded-full p-1.5 grid grid-cols-3 gap-1">
      <a href="index.html" class="rounded-full py-2 flex flex-col items-center justify-center gap-0.5 text-gray-400">
        <i data-lucide="radio" class="w-5 h-5"></i><span class="text-[10px] font-bold leading-none">Live Score</span>
      </a>
      <a href="players.html" class="rounded-full py-2 flex flex-col items-center justify-center gap-0.5 bg-orange-500/25 text-orange-400">
        <i data-lucide="award" class="w-5 h-5"></i><span class="text-[10px] font-bold leading-none">Điểm trình</span>
      </a>
      <a href="admin.html" class="rounded-full py-2 flex flex-col items-center justify-center gap-0.5 text-gray-400">
        <i data-lucide="settings" class="w-5 h-5"></i><span class="text-[10px] font-bold leading-none">Quản trị</span>
      </a>
    </nav>
  </div>

  <div id="toast" class="fixed top-16 left-1/2 -translate-x-1/2 z-50 hidden bg-orange-600 text-white text-xs font-bold px-4 py-2 rounded-full shadow-xl"></div>

  <script type="module">
    import { db, ref, set, update, remove, onValue } from './js/firebase-config.js';
    import { requirePin } from './js/auth.js';

    let players = {};
    let isAdmin = sessionStorage.getItem('bd_pin_unlocked_admin') === 'true';

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.remove('hidden');
      setTimeout(() => t.classList.add('hidden'), 2000);
    }

    function updateAdminUI() {
      document.getElementById('adminAddBox').classList.toggle('hidden', !isAdmin);
      const btn = document.getElementById('btnAdminMode');
      btn.textContent = isAdmin ? '🔓 Đang quản lý' : '🔒 Quản lý';
      btn.className = isAdmin
        ? 'whitespace-nowrap text-[11px] font-bold px-3 py-1.5 rounded-full bg-emerald-500/20 border border-emerald-500/40 text-emerald-400'
        : 'whitespace-nowrap text-[11px] font-bold px-3 py-1.5 rounded-full bg-orange-500/15 border border-orange-500/40 text-orange-300';
      renderPlayers();
    }

    window.toggleAdminMode = async () => {
      if (isAdmin) {
        isAdmin = false;
        updateAdminUI();
        return;
      }
      await requirePin('admin');
      isAdmin = true;
      updateAdminUI();
    };

    onValue(ref(db, 'players'), (snap) => {
      players = snap.val() || {};
      populatePairSelectors();
      renderPlayers();
    });

    window.addPlayer = async () => {
      const name = document.getElementById('inpName').value.trim();
      const gender = document.getElementById('inpGender').value;
      const rating = Number(document.getElementById('inpRating').value) || 2.5;
      const club = document.getElementById('inpClub').value.trim() || 'Bính Dần 1986';
      if (!name) return showToast('Vui lòng nhập tên VĐV');

      const id = `pl_${Date.now()}`;
      await set(ref(db, `players/${id}`), { id, name, gender, rating, club, updatedAt: Date.now() });
      document.getElementById('inpName').value = '';
      showToast(`Đã lưu ${name} (${rating})`);
    };

    window.adjustRating = async (id, delta) => {
      const p = players[id];
      if (!p) return;
      const next = Math.max(1.5, Math.min(6.0, Math.round((Number(p.rating) + delta) * 10) / 10));
      await update(ref(db, `players/${id}`), { rating: next });
    };

    window.deletePlayer = async (id) => {
      if (!confirm('Xóa VĐV này khỏi danh bạ?')) return;
      await remove(ref(db, `players/${id}`));
      showToast('Đã xóa VĐV');
    };

    window.seedSamplePlayers = async () => {
      const samples = [
        { name: 'Lâm Anh Hùng', gender: 'Nam', rating: 3.0, club: 'Bính Dần 1986' },
        { name: 'Nguyễn Nam', gender: 'Nam', rating: 2.8, club: 'Bính Dần 1986' },
        { name: 'Trần Minh', gender: 'Nam', rating: 3.2, club: 'Bính Dần 1986' },
        { name: 'Lê Tuấn', gender: 'Nam', rating: 2.6, club: 'CLB Độc Lập' },
        { name: 'Phạm Lan', gender: 'Nữ', rating: 2.5, club: 'Bính Dần 1986' },
        { name: 'Hoàng Hoa', gender: 'Nữ', rating: 2.4, club: 'Bính Dần 1986' },
        { name: 'Đàm Thùy Dương', gender: 'Nữ', rating: 2.7, club: 'CLB Độc Lập' },
        { name: 'Vũ Sơn', gender: 'Nam', rating: 2.9, club: 'CLB Cao Bằng' }
      ];
      const updates = {};
      samples.forEach((s, i) => {
        const id = `pl_sample_${i + 1}`;
        updates[`players/${id}`] = { id, ...s };
      });
      await update(ref(db, '/'), updates);
      showToast('Đã nạp 8 VĐV mẫu!');
    };

    function populatePairSelectors() {
      const arr = Object.values(players).sort((a, b) => a.name.localeCompare(b.name));
      const opts = '<option value="">-- Chọn VĐV --</option>' +
        arr.map(p => `<option value="${p.id}">${p.name} (${p.rating})</option>`).join('');
      const s1 = document.getElementById('selPair1');
      const s2 = document.getElementById('selPair2');
      const v1 = s1.value, v2 = s2.value;
      s1.innerHTML = opts; s2.innerHTML = opts;
      s1.value = v1; s2.value = v2;
      checkPairRating();
    }

    window.checkPairRating = () => {
      const p1 = players[document.getElementById('selPair1').value];
      const p2 = players[document.getElementById('selPair2').value];
      const limit = Number(document.getElementById('inpMaxRating').value) || 5.5;
      const box = document.getElementById('pairResult');

      if (!p1 || !p2) { box.classList.add('hidden'); return; }
      const sum = Math.round((Number(p1.rating) + Number(p2.rating)) * 10) / 10;
      const ok = sum <= limit;

      box.classList.remove('hidden');
      box.className = ok
        ? 'rounded-xl px-3 py-2 text-xs font-bold flex items-center justify-between bg-emerald-500/15 border border-emerald-500/40 text-emerald-400'
        : 'rounded-xl px-3 py-2 text-xs font-bold flex items-center justify-between bg-red-500/15 border border-red-500/40 text-red-400';
      box.innerHTML = `
        <span>Tổng trình: <b class="text-sm">${sum.toFixed(1)}</b> / ${limit.toFixed(1)}</span>
        <span>${ok ? '✅ HỢP LỆ' : `❌ VƯỢT ${(sum - limit).toFixed(1)}`}</span>
      `;
    };

    window.renderPlayers = () => {
      const q = document.getElementById('inpSearch').value.trim().toLowerCase();
      const g = document.getElementById('filterGender').value;

      const list = Object.values(players)
        .filter(p => (g === 'ALL' || p.gender === g) && (!q || p.name.toLowerCase().includes(q) || (p.club || '').toLowerCase().includes(q)))
        .sort((a, b) => Number(b.rating) - Number(a.rating));

      document.getElementById('totalPlayersCount').textContent = list.length;

      document.getElementById('playersList').innerHTML = list.map((p, idx) => `
        <div class="fire-card rounded-xl px-3.5 py-2.5 flex items-center justify-between gap-2">
          <div class="flex items-center gap-3 min-w-0">
            <span class="w-6 text-center font-black text-xs ${idx < 3 ? 'text-amber-400' : 'text-amber-200/40'}">${idx + 1}</span>
            <div class="min-w-0">
              <div class="flex items-center gap-1.5">
                <span class="font-bold text-sm text-white truncate">${p.name}</span>
                <span class="text-[10px] px-1.5 py-0.5 rounded font-bold ${p.gender === 'Nữ' ? 'bg-pink-500/20 text-pink-300' : 'bg-blue-500/20 text-blue-300'}">${p.gender}</span>
              </div>
              <div class="text-[11px] text-amber-200/60 truncate">${p.club || 'Tự do'}</div>
            </div>
          </div>

          <div class="flex items-center gap-1.5 shrink-0">
            ${isAdmin ? `<button onclick="adjustRating('${p.id}', -0.1)" class="w-6 h-6 rounded-lg bg-white/10 text-xs font-black">-</button>` : ''}
            <span class="px-2.5 py-1 rounded-lg bg-gradient-to-br from-orange-500/25 to-red-600/25 border border-orange-500/40 font-black text-sm text-amber-300 min-w-[44px] text-center">
              ${Number(p.rating).toFixed(1)}
            </span>
            ${isAdmin ? `
              <button onclick="adjustRating('${p.id}', 0.1)" class="w-6 h-6 rounded-lg bg-white/10 text-xs font-black">+</button>
              <button onclick="deletePlayer('${p.id}')" class="ml-1 text-red-400 text-xs font-bold px-1">✕</button>
            ` : ''}
          </div>
        </div>
      `).join('') || '<p class="text-xs text-amber-200/50 text-center py-8">Chưa có VĐV nào. Bấm "Quản lý" để thêm.</p>';
    };

    updateAdminUI();
    lucide.createIcons();
  </script>
</body>
</html>
