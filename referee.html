<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Trọng Tài - Bính Dần Pickleball</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: #090b0f; color: #f3f4f6; font-family: system-ui, -apple-system, sans-serif; touch-action: manipulation; }
    .bd-card { background: #131720; border: 1px solid rgba(249, 115, 22, 0.25); }
    .btn-tap:active { transform: scale(0.96); }
  </style>
</head>
<body class="min-h-screen flex flex-col p-3 max-w-md mx-auto select-none">

  <!-- TOP BAR -->
  <header class="flex items-center justify-between gap-2 mb-3">
    <select id="courtSelector" onchange="changeCourt(this.value)" class="bg-[#131720] border border-orange-500/40 text-orange-400 font-black text-xs rounded-xl px-3 py-2 outline-none">
      <option value="court_1">Sân 1</option>
    </select>
    <span id="matchCategory" class="text-[11px] text-gray-400 truncate flex-1 text-center font-semibold">Đang tải...</span>
    <a href="admin.html" class="text-xs px-2.5 py-2 rounded-xl bg-white/10 text-gray-300 font-bold">Admin</a>
  </header>

  <!-- TRẠNG THÁI CHƯA CÓ TRẬN -->
  <div id="emptyState" class="hidden flex-1 flex flex-col items-center justify-center text-center p-6 bd-card rounded-2xl">
    <div class="text-4xl mb-3">🏓</div>
    <h2 class="font-black text-orange-400 text-base uppercase">Sân đang trống</h2>
    <p class="text-xs text-gray-400 mt-1">Vào trang Admin để gán trận đấu vào sân này.</p>
  </div>

  <!-- BÀN CHẤM ĐIỂM CHÍNH -->
  <main id="refereeBoard" class="hidden flex-1 flex flex-col gap-3">

    <!-- CẢNH BÁO ĐỔI SÂN / GAME POINT / KẾT THÚC -->
    <div id="alertBanner" class="hidden rounded-xl px-3 py-2 text-center font-black text-xs uppercase tracking-wide animate-pulse"></div>

    <!-- ĐỌC ĐIỂM CHUẨN TRỌNG TÀI (VD: 0 - 0 - 2) -->
    <div class="bd-card rounded-2xl p-3 text-center">
      <div class="text-[10px] uppercase tracking-widest text-gray-400 font-bold">Đọc điểm chuẩn</div>
      <div id="callScore" class="text-4xl font-black text-orange-500 tracking-wider my-0.5">0 - 0 - 2</div>
      <div id="modeBadge" class="text-[11px] text-gray-400 font-semibold">Side-out • Chạm 11</div>
    </div>

    <!-- BẢNG ĐIỂM 2 ĐỘI -->
    <div class="grid grid-cols-2 gap-3">
      <!-- ĐỘI A -->
      <div id="cardA" class="bd-card rounded-2xl p-3 flex flex-col justify-between transition-all">
        <div class="flex items-center justify-between">
          <span class="text-[10px] font-black text-gray-400 uppercase">ĐỘI A</span>
          <span id="serveBadgeA" class="hidden text-[10px] px-2 py-0.5 rounded-full bg-orange-500 text-black font-black">● GIAO #1</span>
        </div>
        <div id="nameA" class="font-bold text-sm text-white truncate mt-1">Đội A</div>
        <div id="scoreA" class="text-6xl font-black text-center my-2 text-white">0</div>
        <div class="text-[11px] text-gray-400 space-y-0.5 border-t border-gray-800 pt-2">
          <div>Phải (Chẵn): <b id="pA0" class="text-gray-200">-</b></div>
          <div>Trái (Lẻ): <b id="pA1" class="text-gray-200">-</b></div>
        </div>
      </div>

      <!-- ĐỘI B -->
      <div id="cardB" class="bd-card rounded-2xl p-3 flex flex-col justify-between transition-all">
        <div class="flex items-center justify-between">
          <span class="text-[10px] font-black text-gray-400 uppercase">ĐỘI B</span>
          <span id="serveBadgeB" class="hidden text-[10px] px-2 py-0.5 rounded-full bg-orange-500 text-black font-black">● GIAO #1</span>
        </div>
        <div id="nameB" class="font-bold text-sm text-white truncate mt-1">Đội B</div>
        <div id="scoreB" class="text-6xl font-black text-center my-2 text-white">0</div>
        <div class="text-[11px] text-gray-400 space-y-0.5 border-t border-gray-800 pt-2">
          <div>Phải (Chẵn): <b id="pB0" class="text-gray-200">-</b></div>
          <div>Trái (Lẻ): <b id="pB1" class="text-gray-200">-</b></div>
        </div>
      </div>
    </div>

    <!-- NÚT BẤM CHÍNH (CỠ LỚN CHO NGÓN CÁI) -->
    <div id="sideoutControls" class="grid grid-cols-1 gap-2.5 mt-auto">
      <button onclick="handlePointServing()" class="btn-tap w-full py-5 rounded-2xl bg-gradient-to-r from-orange-500 to-amber-600 text-white font-black text-lg shadow-lg shadow-orange-500/20">
        +1 ĐIỂM (<span id="btnServingName">ĐỘI GIAO</span>)
      </button>
      <button onclick="handleSideOut()" class="btn-tap w-full py-4 rounded-2xl bg-[#1c2333] border border-orange-500/40 text-orange-400 font-black text-base">
        LỖI GIAO / ĐỔI NGƯỜI (SIDE-OUT)
      </button>
    </div>

    <!-- NÚT BẤM CHẾ ĐỘ RALLY -->
    <div id="rallyControls" class="hidden grid-cols-2 gap-2.5 mt-auto">
      <button onclick="handleRallyPoint('A')" class="btn-tap py-5 rounded-2xl bg-orange-600 text-white font-black text-base">+1 ĐỘI A</button>
      <button onclick="handleRallyPoint('B')" class="btn-tap py-5 rounded-2xl bg-blue-600 text-white font-black text-base">+1 ĐỘI B</button>
    </div>

    <!-- NÚT PHỤ: HOÀN TÁC & ĐỔI SÂN -->
    <div class="grid grid-cols-2 gap-2.5">
      <button onclick="handleUndo()" class="btn-tap py-3 rounded-xl bg-white/10 text-gray-200 font-bold text-xs">
        ↩ Hoàn tác (Undo)
      </button>
      <button onclick="handleSwitchSides()" class="btn-tap py-3 rounded-xl bg-white/10 text-gray-200 font-bold text-xs">
        ⇄ Xác nhận Đổi sân
      </button>
    </div>
  </main>

  <script type="module">
    import { db, ref, set, update, onValue } from './js/firebase-config.js';
    import { awardPoint, faultOrSideOut, undoLastAction, getCallScore, getMatchAlerts } from './js/pickleball-engine.js';

    const params = new URLSearchParams(window.location.search);
    let currentCourtId = params.get('court') || 'court_1';
    let currentMatchId = null;
    let currentMatch = null;
    let unsubMatch = null;

    // Tải danh sách sân
    onValue(ref(db, 'courts'), (snap) => {
      const courts = snap.val() || {};
      const sel = document.getElementById('courtSelector');
      sel.innerHTML = Object.entries(courts).map(([id, c]) =>
        `<option value="${id}" ${id === currentCourtId ? 'selected' : ''}>${c.name}</option>`
      ).join('');

      const activeCourt = courts[currentCourtId];
      const nextMatchId = activeCourt ? activeCourt.activeMatchId : null;
      if (nextMatchId !== currentMatchId) {
        listenToMatch(nextMatchId);
      }
    });

    function listenToMatch(matchId) {
      if (unsubMatch) unsubMatch();
      currentMatchId = matchId;
      if (!matchId) {
        currentMatch = null;
        document.getElementById('emptyState').classList.remove('hidden');
        document.getElementById('refereeBoard').classList.add('hidden');
        return;
      }
      unsubMatch = onValue(ref(db, `matches/${matchId}`), (snap) => {
        currentMatch = snap.val();
        if (!currentMatch) return;
        document.getElementById('emptyState').classList.add('hidden');
        document.getElementById('refereeBoard').classList.remove('hidden');
        renderBoard();
      });
    }

    async function saveMatch(newState) {
      if (!currentMatchId) return;
      await set(ref(db, `matches/${currentMatchId}`), newState);
    }

    window.changeCourt = (cId) => {
      window.location.search = `?court=${cId}`;
    };

    window.handlePointServing = () => {
      if (!currentMatch) return;
      saveMatch(awardPoint(currentMatch, currentMatch.servingTeam));
    };

    window.handleSideOut = () => {
      if (!currentMatch) return;
      saveMatch(faultOrSideOut(currentMatch));
    };

    window.handleRallyPoint = (team) => {
      if (!currentMatch) return;
      saveMatch(awardPoint(currentMatch, team));
    };

    window.handleUndo = () => {
      if (!currentMatch) return;
      saveMatch(undoLastAction(currentMatch));
    };

    window.handleSwitchSides = () => {
      if (!currentMatch) return;
      update(ref(db, `matches/${currentMatchId}`), { sidesSwitched: !currentMatch.sidesSwitched });
    };

    function renderBoard() {
      const m = currentMatch;
      document.getElementById('matchCategory').textContent = m.category || '';
      document.getElementById('callScore').textContent = getCallScore(m);
      document.getElementById('modeBadge').textContent =
        `${m.scoringMode === 'rally' ? 'Rally' : 'Side-out'} • Chạm ${m.targetScore}`;

      // Đội A
      document.getElementById('nameA').textContent = m.teamA.name;
      document.getElementById('scoreA').textContent = m.teamA.score;
      document.getElementById('pA0').textContent = (m.teamA.players && m.teamA.players[0]) || '-';
      document.getElementById('pA1').textContent = (m.teamA.players && m.teamA.players[1]) || '-';

      // Đội B
      document.getElementById('nameB').textContent = m.teamB.name;
      document.getElementById('scoreB').textContent = m.teamB.score;
      document.getElementById('pB0').textContent = (m.teamB.players && m.teamB.players[0]) || '-';
      document.getElementById('pB1').textContent = (m.teamB.players && m.teamB.players[1]) || '-';

      // Highlight đội đang giao
      const isA = m.servingTeam === 'A';
      document.getElementById('cardA').style.borderColor = isA ? '#f97316' : 'rgba(255,255,255,0.08)';
      document.getElementById('cardB').style.borderColor = !isA ? '#f97316' : 'rgba(255,255,255,0.08)';

      const badgeA = document.getElementById('serveBadgeA');
      const badgeB = document.getElementById('serveBadgeB');
      badgeA.classList.toggle('hidden', !isA);
      badgeB.classList.toggle('hidden', isA);
      badgeA.textContent = `● GIAO #${m.serverNumber}`;
      badgeB.textContent = `● GIAO #${m.serverNumber}`;

      document.getElementById('btnServingName').textContent = isA ? m.teamA.name : m.teamB.name;

      // Chuyển nút theo luật
      const isRally = m.scoringMode === 'rally';
      document.getElementById('sideoutControls').classList.toggle('hidden', isRally);
      document.getElementById('rallyControls').classList.toggle('hidden', !isRally);
      if (isRally) document.getElementById('rallyControls').classList.add('grid');

      // Cảnh báo
      const alerts = getMatchAlerts(m);
      const banner = document.getElementById('alertBanner');
      if (alerts.winner) {
        banner.textContent = `🏆 KẾT THÚC! ${alerts.winner === 'A' ? m.teamA.name : m.teamB.name} CHIẾN THẮNG!`;
        banner.className = 'rounded-xl px-3 py-2 text-center font-black text-xs uppercase bg-emerald-500 text-black';
      } else if (alerts.isGamePoint) {
        banner.textContent = `🔥 GAME POINT CHO ${alerts.gamePointTeam === 'A' ? m.teamA.name : m.teamB.name}`;
        banner.className = 'rounded-xl px-3 py-2 text-center font-black text-xs uppercase bg-red-600 text-white animate-pulse';
      } else if (alerts.isSwitchSides) {
        banner.textContent = `⇄ ĐẾN ĐIỂM ĐỔI SÂN! Bấm "Xác nhận Đổi sân" sau khi đổi`;
        banner.className = 'rounded-xl px-3 py-2 text-center font-black text-xs uppercase bg-amber-400 text-black';
      } else {
        banner.className = 'hidden';
      }
    }
  </script>
</body>
</html>
