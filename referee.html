<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Trọng Tài 2D - Bính Dần Pickleball</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: #090b0f; color: #f3f4f6; font-family: system-ui, -apple-system, sans-serif; touch-action: manipulation; }
    .bd-card { background: #131720; border: 1px solid rgba(249, 115, 22, 0.25); }
    .btn-tap:active { transform: scale(0.96); }
    .court-surface { background: #1e3a5f; border: 2px solid #f8fafc; }
    .kitchen-zone { background: rgba(249, 115, 22, 0.28); border-top: 2px solid #f8fafc; border-bottom: 2px solid #f8fafc; }
  </style>
</head>
<body class="min-h-screen flex flex-col p-3 max-w-md mx-auto select-none">

  <!-- TOP BAR -->
  <header class="flex items-center justify-between gap-2 mb-2.5">
    <select id="courtSelector" onchange="changeCourt(this.value)" class="bg-[#131720] border border-orange-500/40 text-orange-400 font-black text-xs rounded-xl px-2.5 py-2 outline-none">
      <option value="court_1">Sân 1</option>
    </select>
    <span id="matchCategory" class="text-[11px] text-gray-400 truncate flex-1 text-center font-semibold">Đang tải...</span>
    <button id="btnSound" onclick="toggleSound()" class="text-xs px-2.5 py-2 rounded-xl bg-orange-500/20 text-orange-400 font-bold">🔊</button>
    <a href="admin.html" class="text-xs px-2.5 py-2 rounded-xl bg-white/10 text-gray-300 font-bold">Admin</a>
  </header>

  <!-- TRẠNG THÁI CHƯA CÓ TRẬN -->
  <div id="emptyState" class="hidden flex-1 flex flex-col items-center justify-center text-center p-6 bd-card rounded-2xl">
    <div class="text-4xl mb-3">🏓</div>
    <h2 class="font-black text-orange-400 text-base uppercase">Sân đang trống</h2>
    <p class="text-xs text-gray-400 mt-1">Vào trang Admin để gán trận đấu vào sân này.</p>
  </div>

  <!-- BÀN CHẤM ĐIỂM CHÍNH -->
  <main id="refereeBoard" class="hidden flex-1 flex flex-col gap-2.5">

    <!-- CẢNH BÁO -->
    <div id="alertBanner" class="hidden rounded-xl px-3 py-2 text-center font-black text-xs uppercase tracking-wide"></div>

    <!-- THANH ĐIỂM SỐ & ĐỌC ĐIỂM -->
    <div class="bd-card rounded-2xl p-2.5 flex items-center justify-between gap-2">
      <div class="flex-1 text-center">
        <div id="nameA" class="text-[11px] font-bold text-gray-300 truncate">Đội A</div>
        <div id="scoreA" class="text-4xl font-black text-white leading-none mt-1">0</div>
      </div>

      <div class="px-3 py-1.5 rounded-xl bg-[#090b0f] border border-orange-500/30 text-center shrink-0">
        <div class="text-[9px] uppercase tracking-widest text-gray-400 font-bold">Đọc điểm</div>
        <div id="callScore" class="text-xl font-black text-orange-500 leading-tight">0 - 0 - 2</div>
        <div id="modeBadge" class="text-[9px] text-gray-400 font-semibold">Side-out • 11đ</div>
      </div>

      <div class="flex-1 text-center">
        <div id="nameB" class="text-[11px] font-bold text-gray-300 truncate">Đội B</div>
        <div id="scoreB" class="text-4xl font-black text-white leading-none mt-1">0</div>
      </div>
    </div>

    <!-- SƠ ĐỒ SÂN PICKLEBALL 2D -->
    <div class="bd-card rounded-2xl p-2.5">
      <div class="flex justify-between items-center text-[10px] text-gray-400 mb-1.5 px-1">
        <span class="font-bold text-orange-400">SƠ ĐỒ VỊ TRÍ 2D</span>
        <span id="serveHint" class="font-semibold text-amber-300">Đội A giao bóng #2</span>
      </div>

      <div class="court-surface rounded-lg overflow-hidden text-xs font-bold">
        <!-- NỬA SÂN TRÊN (ĐỘI B) -->
        <div class="grid grid-cols-2 divide-x divide-white/80 h-16">
          <div id="boxB0" class="flex flex-col items-center justify-center p-1 text-center relative transition-colors">
            <span class="text-[9px] text-white/60 uppercase">Phải (Chẵn)</span>
            <span id="pB0" class="truncate max-w-full text-white text-xs">-</span>
          </div>
          <div id="boxB1" class="flex flex-col items-center justify-center p-1 text-center relative transition-colors">
            <span class="text-[9px] text-white/60 uppercase">Trái (Lẻ)</span>
            <span id="pB1" class="truncate max-w-full text-white text-xs">-</span>
          </div>
        </div>

        <!-- KHU VỰC BẾP (KITCHEN / NVZ) + LƯỚI -->
        <div class="kitchen-zone h-8 flex items-center justify-center relative">
          <div class="w-full border-t-2 border-dashed border-white/90 absolute"></div>
          <span class="relative z-10 bg-[#090b0f]/80 text-[9px] px-2 py-0.5 rounded text-orange-300 font-black tracking-widest">LƯỚI / KITCHEN</span>
        </div>

        <!-- NỬA SÂN DƯỚI (ĐỘI A) -->
        <div class="grid grid-cols-2 divide-x divide-white/80 h-16">
          <div id="boxA1" class="flex flex-col items-center justify-center p-1 text-center relative transition-colors">
            <span id="pA1" class="truncate max-w-full text-white text-xs">-</span>
            <span class="text-[9px] text-white/60 uppercase">Trái (Lẻ)</span>
          </div>
          <div id="boxA0" class="flex flex-col items-center justify-center p-1 text-center relative transition-colors">
            <span id="pA0" class="truncate max-w-full text-white text-xs">-</span>
            <span class="text-[9px] text-white/60 uppercase">Phải (Chẵn)</span>
          </div>
        </div>
      </div>
    </div>

    <!-- NÚT BẤM CHÍNH (SIDE-OUT) -->
    <div id="sideoutControls" class="grid grid-cols-1 gap-2 mt-auto">
      <button onclick="handlePointServing()" class="btn-tap w-full py-4 rounded-2xl bg-gradient-to-r from-orange-500 to-amber-600 text-white font-black text-base shadow-lg shadow-orange-500/20">
        +1 ĐIỂM (<span id="btnServingName">ĐỘI GIAO</span>)
      </button>
      <button onclick="handleSideOut()" class="btn-tap w-full py-3.5 rounded-2xl bg-[#1c2333] border border-orange-500/40 text-orange-400 font-black text-sm">
        LỖI GIAO / ĐỔI NGƯỜI (SIDE-OUT)
      </button>
    </div>

    <!-- NÚT BẤM CHẾ ĐỘ RALLY -->
    <div id="rallyControls" class="hidden grid-cols-2 gap-2 mt-auto">
      <button onclick="handleRallyPoint('A')" class="btn-tap py-4 rounded-2xl bg-orange-600 text-white font-black text-base">+1 ĐỘI A</button>
      <button onclick="handleRallyPoint('B')" class="btn-tap py-4 rounded-2xl bg-blue-600 text-white font-black text-base">+1 ĐỘI B</button>
    </div>

    <!-- NÚT PHỤ -->
    <div class="grid grid-cols-2 gap-2">
      <button onclick="handleUndo()" class="btn-tap py-2.5 rounded-xl bg-white/10 text-gray-200 font-bold text-xs">
        ↩ Hoàn tác (Undo)
      </button>
      <button onclick="handleSwitchSides()" class="btn-tap py-2.5 rounded-xl bg-white/10 text-gray-200 font-bold text-xs">
        ⇄ Xác nhận Đổi sân
      </button>
    </div>
  </main>

  <script type="module">
    import { db, ref, set, update, onValue } from './js/firebase-config.js';
    import { awardPoint, faultOrSideOut, undoLastAction, getCallScore, getMatchAlerts } from './js/pickleball-engine.js';
    import { requirePin } from './js/auth.js';

    // Yêu cầu nhập PIN Trọng tài (mặc định: 1234)
    await requirePin('referee');

    const params = new URLSearchParams(window.location.search);
    let currentCourtId = params.get('court') || 'court_1';
    let currentMatchId = null;
    let currentMatch = null;
    let unsubMatch = null;
    let soundEnabled = true;

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep(freq = 800, duration = 0.12, type = 'sine') {
      if (!soundEnabled) return;
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.18, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    window.toggleSound = () => {
      soundEnabled = !soundEnabled;
      document.getElementById('btnSound').textContent = soundEnabled ? '🔊' : '🔇';
    };

    onValue(ref(db, 'courts'), (snap) => {
      const courts = snap.val() || {};
      const sel = document.getElementById('courtSelector');
      sel.innerHTML = Object.entries(courts).map(([id, c]) =>
        `<option value="${id}" ${id === currentCourtId ? 'selected' : ''}>${c.name}</option>`
      ).join('');

      const activeCourt = courts[currentCourtId];
      const nextMatchId = activeCourt ? activeCourt.activeMatchId : null;
      if (nextMatchId !== currentMatchId) listenToMatch(nextMatchId);
    });

    function listenToMatch(matchId) {
      if (unsubMatch) unsubMatch();
      currentMatchId = matchId;
      if (!matchId) {
        currentMatch = null;
        document.getElementById('emptyState').classList.remove('hidden');
        document.getElementById('refereeBoard').classList.add('hidden');
        return;
      }
      unsubMatch = onValue(ref(db, `matches/${matchId}`), (snap) => {
        currentMatch = snap.val();
        if (!currentMatch) return;
        document.getElementById('emptyState').classList.add('hidden');
        document.getElementById('refereeBoard').classList.remove('hidden');
        renderBoard();
      });
    }

    async function saveMatch(newState) {
      if (!currentMatchId) return;
      await set(ref(db, `matches/${currentMatchId}`), newState);

      // Tự động đẩy đội thắng vào vòng tiếp theo nếu là trận Knockout
      if (newState.status === 'finished' && newState.winner && newState.nextMatchId && newState.nextSlot) {
        const winTeam = newState.winner === 'A' ? newState.teamA : newState.teamB;
        const targetPath = `matches/${newState.nextMatchId}/team${newState.nextSlot}`;
        await update(ref(db, targetPath), {
          name: winTeam.name,
          players: winTeam.players || [winTeam.name, '']
        });
        playBeep(1046, 0.35, 'triangle');
      }
    }

    window.changeCourt = (cId) => { window.location.search = `?court=${cId}`; };

    window.handlePointServing = () => {
      if (!currentMatch) return;
      playBeep(880, 0.12);
      saveMatch(awardPoint(currentMatch, currentMatch.servingTeam));
    };

    window.handleSideOut = () => {
      if (!currentMatch) return;
      playBeep(440, 0.18, 'triangle');
      saveMatch(faultOrSideOut(currentMatch));
    };

    window.handleRallyPoint = (team) => {
      if (!currentMatch) return;
      playBeep(880, 0.12);
      saveMatch(awardPoint(currentMatch, team));
    };

    window.handleUndo = () => {
      if (!currentMatch) return;
      playBeep(300, 0.1);
      saveMatch(undoLastAction(currentMatch));
    };

    window.handleSwitchSides = () => {
      if (!currentMatch) return;
      playBeep(660, 0.25);
      update(ref(db, `matches/${currentMatchId}`), { sidesSwitched: !currentMatch.sidesSwitched });
    };

    function renderBoard() {
      const m = currentMatch;
      document.getElementById('matchCategory').textContent = m.category || '';
      document.getElementById('callScore').textContent = getCallScore(m);
      document.getElementById('modeBadge').textContent =
        `${m.scoringMode === 'rally' ? 'Rally' : 'Side-out'} • ${m.targetScore}đ`;

      document.getElementById('nameA').textContent = m.teamA.name;
      document.getElementById('scoreA').textContent = m.teamA.score;
      document.getElementById('nameB').textContent = m.teamB.name;
      document.getElementById('scoreB').textContent = m.teamB.score;

      const pA0 = (m.teamA.players && m.teamA.players[0]) || 'A1';
      const pA1 = (m.teamA.players && m.teamA.players[1]) || 'A2';
      const pB0 = (m.teamB.players && m.teamB.players[0]) || 'B1';
      const pB1 = (m.teamB.players && m.teamB.players[1]) || 'B2';

      const isA = m.servingTeam === 'A';
      const activeScore = isA ? m.teamA.score : m.teamB.score;
      const isEven = activeScore % 2 === 0;
      const activeBoxId = isA ? (isEven ? 'boxA0' : 'boxA1') : (isEven ? 'boxB0' : 'boxB1');

      ['boxA0', 'boxA1', 'boxB0', 'boxB1'].forEach(id => {
        const el = document.getElementById(id);
        el.style.background = (id === activeBoxId && m.status !== 'finished') ? 'rgba(249, 115, 22, 0.45)' : 'transparent';
      });

      document.getElementById('pA0').textContent = (activeBoxId === 'boxA0' ? '🟡 ' : '') + pA0;
      document.getElementById('pA1').textContent = (activeBoxId === 'boxA1' ? '🟡 ' : '') + pA1;
      document.getElementById('pB0').textContent = (activeBoxId === 'boxB0' ? '🟡 ' : '') + pB0;
      document.getElementById('pB1').textContent = (activeBoxId === 'boxB1' ? '🟡 ' : '') + pB1;

      document.getElementById('serveHint').textContent =
        `${isA ? m.teamA.name : m.teamB.name} giao #${m.serverNumber} (${isEven ? 'Ô Phải' : 'Ô Trái'})`;
      document.getElementById('btnServingName').textContent = isA ? m.teamA.name : m.teamB.name;

      const isRally = m.scoringMode === 'rally';
      document.getElementById('sideoutControls').classList.toggle('hidden', isRally);
      document.getElementById('rallyControls').classList.toggle('hidden', !isRally);
      if (isRally) document.getElementById('rallyControls').classList.add('grid');

      const alerts = getMatchAlerts(m);
      const banner = document.getElementById('alertBanner');
      if (alerts.winner) {
        const nextNote = m.nextMatchId ? ' (Đã tự động điền vào vòng sau!)' : '';
        banner.textContent = `🏆 KẾT THÚC! ${alerts.winner === 'A' ? m.teamA.name : m.teamB.name} THẮNG!${nextNote}`;
        banner.className = 'rounded-xl px-3 py-2 text-center font-black text-xs uppercase bg-emerald-500 text-black';
      } else if (alerts.isGamePoint) {
        banner.textContent = `🔥 GAME POINT CHO ${alerts.gamePointTeam === 'A' ? m.teamA.name : m.teamB.name}`;
        banner.className = 'rounded-xl px-3 py-2 text-center font-black text-xs uppercase bg-red-600 text-white animate-pulse';
      } else if (alerts.isSwitchSides) {
        banner.textContent = `⇄ ĐẾN ĐIỂM ĐỔI SÂN! Bấm "Xác nhận Đổi sân"`;
        banner.className = 'rounded-xl px-3 py-2 text-center font-black text-xs uppercase bg-amber-400 text-black';
      } else {
        banner.className = 'hidden';
      }
    }
  </script>
</body>
</html>
