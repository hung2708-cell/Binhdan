<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Bính Dần 1986 - Quản Trị Đồng Đội</title>
  <link rel="icon" type="image/jpeg" href="logo.jpg" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { background-color: #0c0908; color: #f5f0eb; font-family: system-ui, -apple-system, sans-serif; }
    .fire-card { background: #17110e; border: 1px solid rgba(249, 115, 22, 0.3); }
    .fire-btn { background: linear-gradient(135deg, #f97316, #dc2626); }
    .fire-btn:active { transform: scale(0.97); }
  </style>
</head>
<body class="pb-24 lg:pb-6">

  <!-- HEADER -->
  <header class="sticky top-0 z-30 bg-[#0c0908]/95 backdrop-blur border-b border-orange-500/35 px-4 py-2.5 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <img id="clubLogoImg" src="logo.jpg" onerror="this.style.display='none'" class="w-10 h-10 rounded-xl object-cover border border-orange-500/60 bg-black" alt="Logo" />
      <div>
        <h1 class="font-black text-orange-400 tracking-wide text-sm sm:text-base uppercase leading-tight">Bính Dần 1986 Admin</h1>
        <p id="headerTourName" class="text-xs text-amber-200/60 truncate max-w-[170px] sm:max-w-xs">Đang kết nối Firebase...</p>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <a href="index.html" class="text-[11px] px-2.5 py-1 rounded-full bg-white/10 text-amber-100 font-semibold">Khán giả</a>
      <span id="dbStatus" class="text-[11px] px-2.5 py-1 rounded-full bg-amber-500/20 text-amber-400 font-semibold">Đang nối...</span>
    </div>
  </header>

  <div class="max-w-7xl mx-auto lg:flex lg:gap-6 lg:p-6">
    <!-- DESKTOP SIDEBAR -->
    <aside class="hidden lg:flex flex-col w-60 shrink-0 gap-2">
      <button onclick="switchTab('ties')" data-tab="ties" class="nav-btn flex items-center gap-3 px-4 py-3 rounded-xl font-semibold text-left bg-orange-500/15 text-orange-400 border border-orange-500/40">
        <i data-lucide="swords" class="w-5 h-5"></i> Lượt đấu Đồng đội
      </button>
      <button onclick="switchTab('teams')" data-tab="teams" class="nav-btn flex items-center gap-3 px-4 py-3 rounded-xl font-semibold text-left text-gray-400 hover:bg-white/5 border border-transparent">
        <i data-lucide="users" class="w-5 h-5"></i> Đội & Danh sách VĐV
      </button>
      <button onclick="switchTab('courts')" data-tab="courts" class="nav-btn flex items-center gap-3 px-4 py-3 rounded-xl font-semibold text-left text-gray-400 hover:bg-white/5 border border-transparent">
        <i data-lucide="tv" class="w-5 h-5"></i> Điều phối Sân & OBS
      </button>
      <button onclick="switchTab('settings')" data-tab="settings" class="nav-btn flex items-center gap-3 px-4 py-3 rounded-xl font-semibold text-left text-gray-400 hover:bg-white/5 border border-transparent">
        <i data-lucide="settings" class="w-5 h-5"></i> Cài đặt giải
      </button>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="flex-1 p-4 lg:p-0 space-y-5">

      <!-- TAB 1: LƯỢT ĐẤU ĐỒNG ĐỘI (TIES) -->
      <section id="tab-ties" class="tab-section space-y-4">
        <div class="fire-card rounded-2xl p-4 space-y-3">
          <h2 class="font-bold text-orange-400 uppercase text-sm">Tạo lượt đấu Đồng đội (4 trận đôi)</h2>
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-2.5">
            <select id="selTeamA" class="bg-[#0c0908] border border-gray-700 rounded-xl px-3 py-2.5 text-sm"></select>
            <select id="selTeamB" class="bg-[#0c0908] border border-gray-700 rounded-xl px-3 py-2.5 text-sm"></select>
            <select id="selStage" class="bg-[#0c0908] border border-gray-700 rounded-xl px-3 py-2.5 text-sm">
              <option value="group">Vòng bảng (Chạm 15đ)</option>
              <option value="knockout">Loại trực tiếp (15đ, Max 18đ + Đơn 21đ)</option>
            </select>
          </div>
          <button onclick="createTeamTie()" class="fire-btn w-full py-3 rounded-xl font-bold text-sm text-white">
            + Tạo lượt đấu (Sinh sẵn 4 trận đôi)
          </button>
        </div>

        <div id="tiesList" class="space-y-4"></div>
      </section>

      <!-- TAB 2: ĐỘI & VĐV -->
      <section id="tab-teams" class="tab-section hidden space-y-4">
        <div class="fire-card rounded-2xl p-4 space-y-3">
          <h2 class="font-bold text-orange-400 uppercase text-sm">Thêm Đội / CLB Đồng đội</h2>
          <input id="inpTeamName" type="text" placeholder="Tên Đội / CLB (VD: Bính Dần 1)" class="w-full bg-[#0c0908] border border-gray-700 rounded-xl px-3.5 py-2.5 text-sm outline-none focus:border-orange-500" />
          <textarea id="inpRoster" rows="2" placeholder="Danh sách VĐV, cách nhau dấu phẩy (VD: Hùng, Nam, Lan, Hoa, Minh, Tuấn)" class="w-full bg-[#0c0908] border border-gray-700 rounded-xl px-3.5 py-2.5 text-sm outline-none focus:border-orange-500"></textarea>
          <div class="flex gap-2">
            <button onclick="addClubTeam()" class="fire-btn flex-1 py-3 rounded-xl font-bold text-sm text-white">+ Thêm Đội</button>
            <button onclick="seedSampleClubs()" class="px-4 py-3 rounded-xl font-semibold text-xs bg-white/10 text-gray-200">Nạp 4 CLB mẫu</button>
          </div>
        </div>

        <div class="fire-card rounded-2xl p-4 space-y-2.5">
          <h2 class="font-bold text-white text-sm">Danh sách CLB (<span id="teamCountLabel">0</span>)</h2>
          <div id="teamsList" class="space-y-2"></div>
        </div>
      </section>

      <!-- TAB 3: ĐIỀU PHỐI SÂN & OBS -->
      <section id="tab-courts" class="tab-section hidden space-y-4">
        <div class="flex items-center justify-between">
          <h2 class="font-bold text-orange-400 uppercase text-sm">Gán trận ra Sân & Link Trọng tài / OBS</h2>
          <button onclick="addCourt()" class="px-3 py-1.5 rounded-lg bg-orange-500/20 text-orange-400 border border-orange-500/40 text-xs font-bold">+ Thêm Sân</button>
        </div>
        <div id="courtsManagerList" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
      </section>

      <!-- TAB 4: CÀI ĐẶT -->
      <section id="tab-settings" class="tab-section hidden space-y-4">
        <div class="fire-card rounded-2xl p-4 space-y-3">
          <h2 class="font-bold text-orange-400 uppercase text-sm">Thông tin giải đấu</h2>
          <div>
            <label class="text-xs text-gray-400">Tên giải đấu</label>
            <input id="setTourName" type="text" class="mt-1 w-full bg-[#0c0908] border border-gray-700 rounded-xl px-3.5 py-2.5 text-sm" />
          </div>
          <button onclick="saveSettings()" class="fire-btn w-full py-3 rounded-xl font-bold text-sm text-white">Lưu tên giải</button>
        </div>
        <div class="fire-card rounded-2xl p-4 border-red-500/30">
          <h3 class="font-bold text-red-400 text-sm mb-2">Làm mới dữ liệu</h3>
          <button onclick="resetAllData()" class="w-full py-2.5 rounded-xl bg-red-600/20 text-red-400 border border-red-500/40 font-bold text-xs">
            Xóa toàn bộ CLB, Lượt đấu & Trận đấu
          </button>
        </div>
      </section>
    </main>
  </div>

  <!-- MODAL XẾP ĐỘI HÌNH 1 TRẬN CON -->
  <div id="lineupModal" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-end sm:items-center justify-center p-3">
    <div class="w-full max-w-md fire-card rounded-2xl p-4 space-y-3">
      <div class="flex justify-between items-center">
        <h3 id="modalTitle" class="font-black text-orange-400 text-sm uppercase">Xếp đội hình</h3>
        <button onclick="closeLineupModal()" class="text-gray-400 text-lg font-bold px-2">✕</button>
      </div>
      <div id="modalWarn" class="hidden text-xs bg-red-500/20 border border-red-500/50 text-red-300 p-2 rounded-xl font-semibold"></div>
      <div class="space-y-2.5 text-xs">
        <div>
          <label id="lblTeamA" class="font-bold text-amber-300 block mb-1">Đội A</label>
          <div class="grid grid-cols-2 gap-2">
            <select id="mA1" class="bg-[#0c0908] border border-gray-700 rounded-xl px-2.5 py-2"></select>
            <select id="mA2" class="bg-[#0c0908] border border-gray-700 rounded-xl px-2.5 py-2"></select>
          </div>
        </div>
        <div>
          <label id="lblTeamB" class="font-bold text-amber-300 block mb-1">Đội B</label>
          <div class="grid grid-cols-2 gap-2">
            <select id="mB1" class="bg-[#0c0908] border border-gray-700 rounded-xl px-2.5 py-2"></select>
            <select id="mB2" class="bg-[#0c0908] border border-gray-700 rounded-xl px-2.5 py-2"></select>
          </div>
        </div>
      </div>
      <button onclick="saveLineup()" class="fire-btn w-full py-3 rounded-xl font-bold text-sm text-white">Lưu đội hình</button>
    </div>
  </div>

  <!-- MOBILE BOTTOM NAV -->
  <nav class="lg:hidden fixed bottom-0 left-0 right-0 z-40 bg-[#0c0908]/95 backdrop-blur border-t border-orange-500/35 grid grid-cols-4 py-2 px-1">
    <button onclick="switchTab('ties')" data-tab="ties" class="mob-btn flex flex-col items-center gap-1 py-1 text-orange-500">
      <i data-lucide="swords" class="w-5 h-5"></i><span class="text-[10px] font-bold">Lượt đấu</span>
    </button>
    <button onclick="switchTab('teams')" data-tab="teams" class="mob-btn flex flex-col items-center gap-1 py-1 text-gray-400">
      <i data-lucide="users" class="w-5 h-5"></i><span class="text-[10px] font-bold">CLB & VĐV</span>
    </button>
    <button onclick="switchTab('courts')" data-tab="courts" class="mob-btn flex flex-col items-center gap-1 py-1 text-gray-400">
      <i data-lucide="tv" class="w-5 h-5"></i><span class="text-[10px] font-bold">Sân & OBS</span>
    </button>
    <button onclick="switchTab('settings')" data-tab="settings" class="mob-btn flex flex-col items-center gap-1 py-1 text-gray-400">
      <i data-lucide="settings" class="w-5 h-5"></i><span class="text-[10px] font-bold">Cài đặt</span>
    </button>
  </nav>

  <div id="toast" class="fixed top-16 left-1/2 -translate-x-1/2 z-50 hidden bg-orange-600 text-white text-xs font-bold px-4 py-2.5 rounded-full shadow-xl"></div>

  <script type="module">
    import { db, ref, set, update, onValue, remove } from './js/firebase-config.js';
    import { createInitialMatchState } from './js/pickleball-engine.js';
    import { requirePin } from './js/auth.js';

    await requirePin('admin');

    let state = { settings: { name: 'Giải Đồng Đội Bính Dần 1986' }, teams: {}, ties: {}, courts: {}, matches: {} };
    let editingMatchId = null;

    onValue(ref(db, '/'), (snap) => {
      const data = snap.val() || {};
      state.settings = { ...state.settings, ...(data.settings || {}) };
      state.teams = data.teams || {};
      state.ties = data.ties || {};
      state.courts = data.courts || {};
      state.matches = data.matches || {};

      if (Object.keys(state.courts).length === 0) {
        set(ref(db, 'courts'), {
          court_1: { name: 'Sân 1 (Trung Tâm)', activeMatchId: '' },
          court_2: { name: 'Sân 2', activeMatchId: '' },
          court_3: { name: 'Sân 3', activeMatchId: '' }
        });
      }
      document.getElementById('dbStatus').textContent = '● Live Firebase';
      document.getElementById('dbStatus').className = 'text-[11px] px-2.5 py-1 rounded-full bg-emerald-500/20 text-emerald-400 font-semibold';
      renderAll();
    });

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.remove('hidden');
      setTimeout(() => t.classList.add('hidden'), 2200);
    }

    window.switchTab = (tabName) => {
      document.querySelectorAll('.tab-section').forEach(s => s.classList.add('hidden'));
      document.getElementById(`tab-${tabName}`).classList.remove('hidden');
      document.querySelectorAll('.mob-btn').forEach(b => {
        b.className = `mob-btn flex flex-col items-center gap-1 py-1 ${b.dataset.tab === tabName ? 'text-orange-500' : 'text-gray-400'}`;
      });
      document.querySelectorAll('.nav-btn').forEach(b => {
        b.className = b.dataset.tab === tabName
          ? 'nav-btn flex items-center gap-3 px-4 py-3 rounded-xl font-semibold text-left bg-orange-500/15 text-orange-400 border border-orange-500/40'
          : 'nav-btn flex items-center gap-3 px-4 py-3 rounded-xl font-semibold text-left text-gray-400 hover:bg-white/5 border border-transparent';
      });
    };

    window.addClubTeam = async () => {
      const name = document.getElementById('inpTeamName').value.trim();
      const raw = document.getElementById('inpRoster').value.trim();
      if (!name) return showToast('Nhập tên CLB / Đội');
      const roster = raw ? raw.split(',').map(s => s.trim()).filter(Boolean) : ['VĐV 1', 'VĐV 2', 'VĐV 3', 'VĐV 4'];
      const id = `club_${Date.now()}`;
      await set(ref(db, `teams/${id}`), { id, name, roster });
      document.getElementById('inpTeamName').value = '';
      document.getElementById('inpRoster').value = '';
      showToast('Đã thêm CLB!');
    };

    window.seedSampleClubs = async () => {
      const clubs = [
        { id: 'club_1', name: 'Bính Dần 1', roster: ['Hùng', 'Nam', 'Lan', 'Hoa', 'Sơn', 'Thảo'] },
        { id: 'club_2', name: 'Bính Dần 2', roster: ['Minh', 'Tuấn', 'Mai', 'Cúc', 'Dũng', 'Hương'] },
        { id: 'club_3', name: 'CLB Độc Lập', roster: ['Hiếu', 'Khang', 'Ngọc', 'Linh', 'Quân', 'Trang'] },
        { id: 'club_4', name: 'CLB Cao Bằng', roster: ['Huy', 'Đức', 'Vy', 'Anh', 'Long', 'Yến'] }
      ];
      const updates = {};
      clubs.forEach(c => { updates[`teams/${c.id}`] = c; });
      await update(ref(db, '/'), updates);
      showToast('Đã nạp 4 CLB mẫu!');
    };

    window.deleteTeam = async (id) => { await remove(ref(db, `teams/${id}`)); showToast('Đã xóa CLB'); };

    // Tạo lượt đấu đồng đội 4 trận đôi
    window.createTeamTie = async () => {
      const idA = document.getElementById('selTeamA').value;
      const idB = document.getElementById('selTeamB').value;
      const stage = document.getElementById('selStage').value;
      if (!idA || !idB || idA === idB) return showToast('Chọn 2 CLB khác nhau!');

      const tA = state.teams[idA];
      const tB = state.teams[idB];
      const tieId = `tie_${Date.now()}`;
      const subLabels = ['Trận 1: Đôi Nữ', 'Trận 2: Đôi Nam', 'Trận 3: Đôi Nam Nữ 1', 'Trận 4: Đôi Nam Nữ 2'];

      const updates = {};
      const matchIds = [];
      subLabels.forEach((lbl, idx) => {
        const mId = `${tieId}_m${idx + 1}`;
        matchIds.push(mId);
        const m = createInitialMatchState({
          id: mId,
          tieId,
          subMatchIndex: idx + 1,
          stage,
          category: `${lbl} (${tA.name} vs ${tB.name})`,
          targetScore: 15,
          switchPoint: 8,
          winByTwo: stage === 'knockout',
          maxScore: stage === 'knockout' ? 18 : 0,
          teamAName: tA.name,
          teamAPlayers: [tA.roster[0] || 'VĐV A1', tA.roster[1] || 'VĐV A2'],
          teamBName: tB.name,
          teamBPlayers: [tB.roster[0] || 'VĐV B1', tB.roster[1] || 'VĐV B2']
        });
        m.status = 'waiting';
        updates[`matches/${mId}`] = m;
      });

      updates[`ties/${tieId}`] = {
        id: tieId,
        teamAId: idA, teamAName: tA.name,
        teamBId: idB, teamBName: tB.name,
        stage,
        matchIds,
        walkoverWinner: '',
        createdAt: Date.now()
      };

      await update(ref(db, '/'), updates);
      showToast('Đã tạo lượt đấu 4 trận đôi!');
    };

    // Mở Trận 5 (Đơn 21 điểm - Dreambreaker) khi hòa 2-2 ở vòng loại trực tiếp
    window.openDreambreaker = async (tieId) => {
      const tie = state.ties[tieId];
      if (!tie) return;
      const mId = `${tieId}_m5`;
      const m = createInitialMatchState({
        id: mId,
        tieId,
        subMatchIndex: 5,
        stage: 'knockout',
        isDreambreaker: true,
        category: `Trận 5: ĐƠN QUYẾT ĐỊNH 21Đ (${tie.teamAName} vs ${tie.teamBName})`,
        teamAName: tie.teamAName,
        teamAPlayers: ['Đội hình đơn A', ''],
        teamBName: tie.teamBName,
        teamBPlayers: ['Đội hình đơn B', '']
      });
      m.status = 'waiting';
      const newIds = [...(tie.matchIds || []), mId];
      await update(ref(db, '/'), {
        [`matches/${mId}`]: m,
        [`ties/${tieId}/matchIds`]: newIds
      });
      showToast('Đã mở Trận 5 Đơn quyết định 21đ!');
    };

    // Xử bỏ cuộc toàn lượt đấu (Thắng 4-0, mỗi trận 15-0)
    window.setWalkover = async (tieId, winnerSide) => {
      const tie = state.ties[tieId];
      if (!confirm(`Xác nhận xử ${winnerSide === 'A' ? tie.teamAName : tie.teamBName} thắng bỏ cuộc 4-0 (15-0)?`)) return;
      const updates = { [`ties/${tieId}/walkoverWinner`]: winnerSide };
      (tie.matchIds || []).slice(0, 4).forEach(mId => {
        updates[`matches/${mId}/status`] = 'finished';
        updates[`matches/${mId}/winner`] = winnerSide;
        updates[`matches/${mId}/teamA/score`] = winnerSide === 'A' ? 15 : 0;
        updates[`matches/${mId}/teamB/score`] = winnerSide === 'B' ? 15 : 0;
      });
      await update(ref(db, '/'), updates);
      showToast('Đã cập nhật kết quả bỏ cuộc 4-0!');
    };

    // Kiểm tra VĐV đánh quá 2 trận trong 1 lượt đấu
    function getOverplayedPlayers(tie) {
      const counts = {};
      (tie.matchIds || []).slice(0, 4).forEach(mId => {
        const m = state.matches[mId];
        if (!m) return;
        [...(m.teamA.players || []), ...(m.teamB.players || [])].forEach(p => {
          if (p && p !== '-') counts[p] = (counts[p] || 0) + 1;
        });
      });
      return Object.entries(counts).filter(([_, c]) => c > 2).map(([p, c]) => `${p} (${c} trận)`);
    }

    // Modal xếp đội hình
    window.openLineupModal = (mId) => {
      const m = state.matches[mId];
      const tie = state.ties[m.tieId];
      if (!m || !tie) return;
      editingMatchId = mId;

      const rA = (state.teams[tie.teamAId]?.roster) || m.teamA.players;
      const rB = (state.teams[tie.teamBId]?.roster) || m.teamB.players;

      document.getElementById('modalTitle').textContent = m.category;
      document.getElementById('lblTeamA').textContent = tie.teamAName;
      document.getElementById('lblTeamB').textContent = tie.teamBName;

      const fill = (elId, list, val) => {
        document.getElementById(elId).innerHTML = list.map(p => `<option value="${p}" ${p === val ? 'selected' : ''}>${p}</option>`).join('');
      };
      fill('mA1', rA, m.teamA.players[0]);
      fill('mA2', rA, m.teamA.players[1]);
      fill('mB1', rB, m.teamB.players[0]);
      fill('mB2', rB, m.teamB.players[1]);

      document.getElementById('lineupModal').classList.remove('hidden');
    };

    window.closeLineupModal = () => document.getElementById('lineupModal').classList.add('hidden');

    window.saveLineup = async () => {
      if (!editingMatchId) return;
      const pA = [document.getElementById('mA1').value, document.getElementById('mA2').value];
      const pB = [document.getElementById('mB1').value, document.getElementById('mB2').value];
      await update(ref(db, `matches/${editingMatchId}`), {
        'teamA/players': pA,
        'teamB/players': pB
      });
      closeLineupModal();
      showToast('Đã lưu đội hình!');
    };

    window.addCourt = async () => {
      const num = Object.keys(state.courts).length + 1;
      await set(ref(db, `courts/court_${num}`), { name: `Sân ${num}`, activeMatchId: '' });
      showToast(`Đã thêm Sân ${num}`);
    };

    window.assignMatchToCourt = async (courtId, matchId) => {
      await update(ref(db, `courts/${courtId}`), { activeMatchId: matchId });
      if (matchId) {
        await update(ref(db, `matches/${matchId}`), { courtId, status: 'live' });
        showToast(`Đã đẩy trận ra ${state.courts[courtId].name}!`);
      }
    };

    window.copyLink = (path) => {
      navigator.clipboard.writeText(new URL(path, window.location.href).href);
      showToast('Đã copy link!');
    };

    window.saveSettings = async () => {
      await update(ref(db, 'settings'), { name: document.getElementById('setTourName').value.trim() || 'Giải Đồng Đội Bính Dần 1986' });
      showToast('Đã lưu cài đặt!');
    };

    window.resetAllData = async () => {
      if (!confirm('Xóa toàn bộ CLB, Lượt đấu và Trận đấu?')) return;
      await remove(ref(db, 'teams'));
      await remove(ref(db, 'ties'));
      await remove(ref(db, 'matches'));
      Object.keys(state.courts).forEach(cId => update(ref(db, `courts/${cId}`), { activeMatchId: '' }));
      showToast('Đã làm mới toàn bộ!');
    };

    function renderAll() {
      document.getElementById('headerTourName').textContent = state.settings.name;
      document.getElementById('setTourName').value = state.settings.name;

      const teamsArr = Object.values(state.teams);
      document.getElementById('teamCountLabel').textContent = teamsArr.length;

      // Dropdown chọn CLB
      const opts = teamsArr.map(t => `<option value="${t.id}">${t.name}</option>`).join('') || '<option value="">-- Chưa có CLB --</option>';
      const selA = document.getElementById('selTeamA');
      const selB = document.getElementById('selTeamB');
      if (selA.innerHTML !== opts) { selA.innerHTML = opts; selB.innerHTML = opts; }

      // Render Danh sách CLB
      document.getElementById('teamsList').innerHTML = teamsArr.map(t => `
        <div class="bg-[#0c0908] p-3 rounded-xl border border-orange-500/20 flex justify-between items-start gap-2">
          <div>
            <div class="font-bold text-sm text-orange-300">${t.name}</div>
            <div class="text-xs text-gray-400 mt-0.5">VĐV: ${(t.roster || []).join(', ')}</div>
          </div>
          <button onclick="deleteTeam('${t.id}')" class="text-xs text-red-400 font-bold px-2">Xóa</button>
        </div>
      `).join('') || '<p class="text-xs text-gray-500 text-center py-3">Chưa có CLB nào.</p>';

      // Render Lượt đấu Đồng đội (Ties)
      const tiesArr = Object.values(state.ties).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
      document.getElementById('tiesList').innerHTML = tiesArr.map(tie => {
        const subMatches = (tie.matchIds || []).map(id => state.matches[id]).filter(Boolean);
        let winsA = 0, winsB = 0;
        subMatches.forEach(m => { if (m.winner === 'A') winsA++; if (m.winner === 'B') winsB++; });

        const overplayed = getOverplayedPlayers(tie);
        const needDreambreaker = tie.stage === 'knockout' && winsA === 2 && winsB === 2 && subMatches.length === 4;

        return `
          <div class="fire-card rounded-2xl p-4 space-y-3">
            <div class="flex flex-wrap items-center justify-between gap-2 border-b border-orange-500/20 pb-2.5">
              <div>
                <span class="text-[10px] font-black uppercase px-2 py-0.5 rounded bg-orange-500/20 text-orange-400">
                  ${tie.stage === 'knockout' ? 'Loại trực tiếp' : 'Vòng bảng'}
                </span>
                <div class="font-black text-base text-white mt-1">
                  ${tie.teamAName} <span class="text-orange-400 mx-1">${winsA} - ${winsB}</span> ${tie.teamBName}
                </div>
              </div>
              <div class="flex gap-1.5">
                <button onclick="setWalkover('${tie.id}','A')" class="text-[10px] px-2 py-1 rounded bg-white/5 text-gray-400">Bỏ cuộc B</button>
                <button onclick="setWalkover('${tie.id}','B')" class="text-[10px] px-2 py-1 rounded bg-white/5 text-gray-400">Bỏ cuộc A</button>
              </div>
            </div>

            ${overplayed.length ? `
              <div class="text-xs bg-red-500/20 border border-red-500/50 text-red-300 px-3 py-2 rounded-xl font-bold">
                ⚠️ Cảnh báo quá 2 trận/VĐV: ${overplayed.join(', ')}
              </div>` : ''}

            <div class="space-y-2">
              ${subMatches.map(m => `
                <div class="bg-[#0c0908] border border-gray-800 rounded-xl p-2.5 flex items-center justify-between gap-2 text-xs">
                  <div class="min-w-0 flex-1">
                    <div class="font-bold text-amber-300 truncate">${m.category.split('(')[0]}</div>
                    <div class="text-[11px] text-gray-400 truncate">
                      ${(m.teamA.players || []).join('/')} <b class="text-white mx-1">${m.teamA.score}-${m.teamB.score}</b> ${(m.teamB.players || []).join('/')}
                    </div>
                  </div>
                  ${!m.isDreambreaker ? `<button onclick="openLineupModal('${m.id}')" class="shrink-0 px-2.5 py-1.5 rounded-lg bg-white/10 text-gray-200 font-bold">Đội hình</button>` : ''}
                </div>
              `).join('')}
            </div>

            ${needDreambreaker ? `
              <button onclick="openDreambreaker('${tie.id}')" class="w-full py-2.5 rounded-xl bg-emerald-600 text-white font-black text-xs animate-pulse">
                ⚡ HÒA 2-2! BẤM MỞ TRẬN 5 ĐƠN QUYẾT ĐỊNH (21 ĐIỂM)
              </button>` : ''}
          </div>`;
      }).join('') || '<p class="text-xs text-gray-500 text-center py-6">Chưa có lượt đấu đồng đội nào.</p>';

      // Render Sân đấu
      const matchesArr = Object.values(state.matches);
      document.getElementById('courtsManagerList').innerHTML = Object.entries(state.courts).map(([cId, c]) => `
        <div class="fire-card rounded-2xl p-4 space-y-3">
          <div class="flex justify-between items-center">
            <h3 class="font-black text-orange-400 uppercase text-sm">${c.name}</h3>
            <span class="text-[11px] text-gray-500">${cId}</span>
          </div>
          <select onchange="assignMatchToCourt('${cId}', this.value)" class="w-full bg-[#0c0908] border border-gray-700 rounded-xl px-3 py-2.5 text-xs">
            <option value="">-- Chọn trận đẩy ra sân --</option>
            ${matchesArr.map(m => `
              <option value="${m.id}" ${c.activeMatchId === m.id ? 'selected' : ''}>
                ${m.category} (${m.teamA.score}-${m.teamB.score})
              </option>
            `).join('')}
          </select>
          <div class="grid grid-cols-2 gap-2">
            <a href="referee.html?court=${cId}" target="_blank" class="fire-btn py-2.5 rounded-xl text-center text-xs font-bold text-white">Mở Trọng tài</a>
            <button onclick="copyLink('overlay.html?court=${cId}')" class="py-2.5 rounded-xl bg-white/10 text-xs font-bold text-orange-300">Copy Link OBS</button>
          </div>
        </div>
      `).join('');

      lucide.createIcons();
    }
  </script>
</body>
</html>
