<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Bảng Đấu A–D - Bính Dần 1986 Pickleball</title>
  <link rel="icon" type="image/jpeg" href="logo.jpg" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body {
      background-color: #090b0f;
      background-image:
        radial-gradient(circle at 15% 0%, rgba(249, 115, 22, 0.12), transparent 45%),
        radial-gradient(circle at 85% 10%, rgba(16, 185, 129, 0.06), transparent 40%);
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .sc-card {
      background: #12161f;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.35);
    }
    .fire-btn {
      background: linear-gradient(135deg, #f97316, #dc2626);
    }
    .fire-btn:active { transform: scale(0.97); }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="min-h-screen pb-10">

  <!-- HEADER -->
  <header class="sticky top-0 z-30 bg-[#090b0f]/90 backdrop-blur-md border-b border-white/10 px-3.5 py-2.5">
    <div class="max-w-6xl mx-auto flex items-center justify-between gap-2">
      <div class="flex items-center gap-2.5 min-w-0">
        <img src="logo.jpg" onerror="this.style.display='none'" class="w-9 h-9 rounded-xl object-cover border border-orange-500/50 bg-black shrink-0" alt="Logo" />
        <div class="min-w-0">
          <h1 class="font-black text-orange-400 tracking-wide text-sm uppercase leading-tight truncate">Bảng Đấu A–D</h1>
          <p id="grpTourName" class="text-[11px] text-slate-400 truncate">Giải Pickleball Bính Dần 1986</p>
        </div>
      </div>

      <div class="flex items-center gap-1.5 shrink-0">
        <a href="index.html" class="whitespace-nowrap text-[11px] px-3 py-1.5 rounded-full bg-white/[0.06] border border-white/10 text-slate-200 font-semibold">Khán giả</a>
        <a href="players.html" class="hidden sm:inline-block whitespace-nowrap text-[11px] px-3 py-1.5 rounded-full bg-white/[0.06] border border-white/10 text-slate-200 font-semibold">Điểm trình</a>
        <a href="admin.html" class="whitespace-nowrap text-[11px] px-3 py-1.5 rounded-full bg-white/[0.06] border border-white/10 text-slate-200 font-semibold">Quản trị</a>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto p-4 lg:p-6 space-y-4">

    <!-- BỘ LỌC NỘI DUNG & THAO TÁC CHIA BẢNG -->
    <section class="sc-card rounded-2xl p-3.5 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
      <div class="flex gap-1.5 overflow-x-auto no-scrollbar">
        <button onclick="selectCategoryFilter('ALL')" data-cat="ALL" class="cat-pill shrink-0 px-3.5 py-1.5 rounded-full text-xs font-black bg-orange-500 text-slate-950">Tất cả</button>
        <button onclick="selectCategoryFilter('Đôi Nam')" data-cat="Đôi Nam" class="cat-pill shrink-0 px-3.5 py-1.5 rounded-full text-xs font-semibold bg-white/[0.06] text-slate-300">Đôi Nam</button>
        <button onclick="selectCategoryFilter('Đôi Nữ')" data-cat="Đôi Nữ" class="cat-pill shrink-0 px-3.5 py-1.5 rounded-full text-xs font-semibold bg-white/[0.06] text-slate-300">Đôi Nữ</button>
        <button onclick="selectCategoryFilter('Đôi Nam Nữ')" data-cat="Đôi Nam Nữ" class="cat-pill shrink-0 px-3.5 py-1.5 rounded-full text-xs font-semibold bg-white/[0.06] text-slate-300">Đôi Nam Nữ</button>
      </div>

      <div class="flex items-center gap-2 shrink-0">
        <select id="groupCountSel" class="bg-[#090b0f] border border-white/10 rounded-xl px-2.5 py-2 text-xs font-bold text-amber-300 outline-none">
          <option value="2">2 Bảng (A, B)</option>
          <option value="4" selected>4 Bảng (A–D)</option>
        </select>
        <button onclick="autoDrawGroups()" class="fire-btn px-3.5 py-2 rounded-xl text-xs font-black text-white shadow">
          Bốc thăm chia bảng
        </button>
        <button onclick="clearGroupsDraw()" class="px-3 py-2 rounded-xl bg-white/[0.06] border border-white/10 text-xs font-bold text-slate-300 hover:text-red-400">
          Xóa bảng
        </button>
      </div>
    </section>

    <!-- LƯỚI CÁC BẢNG ĐẤU (MÁY TÍNH 2 CỘT, ĐIỆN THOẠI 1 CỘT) -->
    <section id="groupsGrid" class="grid grid-cols-1 md:grid-cols-2 gap-4"></section>

    <!-- DANH SÁCH CẶP ĐÔI CHƯA XẾP BẢNG -->
    <section class="sc-card rounded-2xl p-4 space-y-2.5">
      <div class="flex items-center justify-between">
        <h2 class="font-bold text-orange-400 uppercase text-xs tracking-wider">Danh sách Cặp đôi (<span id="poolCount">0</span>)</h2>
        <button onclick="seedPairsIfEmpty()" class="text-[11px] px-2.5 py-1 rounded-lg bg-white/[0.06] border border-white/10 text-amber-200 font-semibold">Nạp mẫu nếu trống</button>
      </div>
      <div id="unassignedList" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-2 text-xs"></div>
    </section>

  </main>

  <!-- POPUP XÁC NHẬN & THÔNG BÁO ĐỒNG BỘ (#090b0f / #12161f) -->
  <div id="scDialog" onclick="if(event.target === this) resolveDialog(false)" class="hidden fixed inset-0 z-[9999] bg-[#090b0f]/90 backdrop-blur-md flex items-center justify-center p-4">
    <div class="w-full max-w-xs bg-[#12161f] border border-orange-500/40 rounded-2xl p-6 text-center shadow-2xl space-y-4">
      <div id="dlgIcon" class="w-12 h-12 mx-auto rounded-xl bg-orange-500/20 text-orange-400 flex items-center justify-center text-2xl">🎲</div>
      <div>
        <h2 id="dlgTitle" class="font-black text-orange-400 uppercase text-sm tracking-wide">Xác nhận</h2>
        <p id="dlgMessage" class="text-xs text-slate-300 mt-1.5 leading-relaxed"></p>
      </div>
      <button id="dlgConfirm" class="w-full py-3 rounded-xl bg-gradient-to-r from-orange-500 to-red-600 text-white font-black text-sm shadow-lg active:scale-95 transition">
        XÁC NHẬN
      </button>
      <button id="dlgCancel" onclick="resolveDialog(false)" class="block w-full text-xs text-slate-400 hover:text-white pt-1 font-semibold">
        Hủy bỏ
      </button>
    </div>
  </div>

  <div id="toast" class="fixed top-16 left-1/2 -translate-x-1/2 z-50 hidden bg-orange-600 text-white text-xs font-bold px-4 py-2.5 rounded-full shadow-xl"></div>

  <script type="module">
    import { db, ref, set, update, onValue, remove } from './js/firebase-config.js';

    let state = { settings: {}, doublesTeams: {}, groupDraw: null };
    let activeCat = 'ALL';
    let dialogResolver = null;

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.remove('hidden');
      setTimeout(() => t.classList.add('hidden'), 2200);
    }

    function scDialog({ title = 'Thông báo', message = '', icon = '🎲', confirmText = 'XÁC NHẬN', showCancel = true, danger = false } = {}) {
      return new Promise((resolve) => {
        dialogResolver = resolve;
        document.getElementById('dlgIcon').textContent = icon;
        const h2 = document.getElementById('dlgTitle');
        h2.textContent = title;
        h2.className = `font-black uppercase text-sm tracking-wide ${danger ? 'text-red-400' : 'text-orange-400'}`;
        document.getElementById('dlgMessage').textContent = message;

        const okBtn = document.getElementById('dlgConfirm');
        okBtn.textContent = confirmText;
        okBtn.className = `w-full py-3 rounded-xl text-white font-black text-sm shadow-lg active:scale-95 transition ${
          danger ? 'bg-gradient-to-r from-red-600 to-rose-700' : 'bg-gradient-to-r from-orange-500 to-red-600'
        }`;
        okBtn.onclick = () => resolveDialog(true);

        document.getElementById('dlgCancel').classList.toggle('hidden', !showCancel);
        document.getElementById('scDialog').classList.remove('hidden');
      });
    }

    window.resolveDialog = (val) => {
      document.getElementById('scDialog').classList.add('hidden');
      if (dialogResolver) {
        const fn = dialogResolver;
        dialogResolver = null;
        fn(val);
      }
    };

    window.selectCategoryFilter = (cat) => {
      activeCat = cat;
      document.querySelectorAll('.cat-pill').forEach(btn => {
        const isSel = btn.dataset.cat === cat;
        btn.className = `cat-pill shrink-0 px-3.5 py-1.5 rounded-full text-xs transition ${
          isSel ? 'bg-orange-500 text-slate-950 font-black' : 'bg-white/[0.06] text-slate-300 font-semibold'
        }`;
      });
      renderGroups();
    };

    window.seedPairsIfEmpty = async () => {
      if (Object.keys(state.doublesTeams).length > 0) {
        return showToast('Đã có dữ liệu cặp đôi');
      }
      const sample = {
        dbl_1: { id: 'dbl_1', name: 'Hùng / Nam', pairType: 'Đôi Nam', totalRating: 5.8, players: ['Hùng', 'Nam'] },
        dbl_2: { id: 'dbl_2', name: 'Minh / Tuấn', pairType: 'Đôi Nam', totalRating: 5.7, players: ['Minh', 'Tuấn'] },
        dbl_3: { id: 'dbl_3', name: 'Sơn / Lan', pairType: 'Đôi Nam Nữ', totalRating: 5.4, players: ['Sơn', 'Lan'] },
        dbl_4: { id: 'dbl_4', name: 'Hoa / Dương', pairType: 'Đôi Nữ', totalRating: 5.1, players: ['Hoa', 'Dương'] }
      };
      await update(ref(db, 'doublesTeams'), sample);
      showToast('Đã nạp 4 cặp đôi mẫu');
    };

    window.autoDrawGroups = async () => {
      const allPairs = Object.values(state.doublesTeams);
      const pool = activeCat === 'ALL'
        ? allPairs
        : allPairs.filter(p => (p.pairType || 'Đôi Nam') === activeCat);

      const numGroups = Number(document.getElementById('groupCountSel').value) || 4;
      if (pool.length < numGroups) {
        await scDialog({
          title: 'Chưa đủ cặp đôi',
          message: `Cần ít nhất ${numGroups} cặp đôi (hiện có ${pool.length} cặp) để chia ${numGroups} bảng.`,
          icon: '⚠️',
          confirmText: 'ĐÃ HIỂU',
          showCancel: false
        });
        return;
      }

      const ok = await scDialog({
        title: 'Bốc thăm chia bảng',
        message: `Chia ngẫu nhiên ${pool.length} cặp đôi thành ${numGroups} bảng (${activeCat === 'ALL' ? 'Tất cả' : activeCat})?`,
        icon: '🎲',
        confirmText: 'BỐC THĂM NGAY'
      });
      if (!ok) return;

      const shuffled = [...pool].sort(() => Math.random() - 0.5);
      const letters = ['A', 'B', 'C', 'D'].slice(0, numGroups);
      const groups = {};
      letters.forEach(l => { groups[l] = []; });

      shuffled.forEach((pair, idx) => {
        groups[letters[idx % numGroups]].push(pair);
      });

      const drawData = {
        category: activeCat,
        letters,
        groups,
        updatedAt: Date.now()
      };
      await set(ref(db, 'groupDraw'), drawData);
      showToast('Đã cập nhật bảng đấu');
    };

    window.clearGroupsDraw = async () => {
      if (!state.groupDraw) return showToast('Chưa có bảng đấu nào');
      const ok = await scDialog({
        title: 'Xóa bảng đấu',
        message: 'Xóa kết quả chia bảng hiện tại khỏi hệ thống?',
        icon: '🗑️',
        confirmText: 'XÓA BẢNG',
        danger: true
      });
      if (!ok) return;
      await remove(ref(db, 'groupDraw'));
      showToast('Đã xóa bảng đấu');
    };

    function renderGroups() {
      const allPairs = Object.values(state.doublesTeams);
      const filteredPool = activeCat === 'ALL'
        ? allPairs
        : allPairs.filter(p => (p.pairType || 'Đôi Nam') === activeCat);

      document.getElementById('poolCount').textContent = filteredPool.length;
      document.getElementById('unassignedList').innerHTML = filteredPool.map(p => `
        <div class="bg-[#090b0f] border border-white/10 rounded-xl px-3 py-2 flex items-center justify-between gap-2">
          <div class="min-w-0">
            <div class="font-bold text-white truncate">${p.name}</div>
            <div class="text-[10px] text-slate-400">${p.pairType || 'Đôi'}</div>
          </div>
          <span class="px-2 py-0.5 rounded bg-orange-500/15 text-amber-300 font-black text-[11px] shrink-0">${Number(p.totalRating || 0).toFixed(1)}</span>
        </div>
      `).join('') || '<p class="text-slate-500 col-span-full py-2">Chưa có cặp đôi nào trong mục này.</p>';

      const draw = state.groupDraw;
      const grid = document.getElementById('groupsGrid');
      if (!draw || !draw.groups) {
        grid.innerHTML = `
          <div class="sc-card rounded-2xl p-6 text-center col-span-full space-y-1">
            <div class="font-bold text-slate-300 text-sm">Chưa chia bảng đấu</div>
            <p class="text-xs text-slate-400">Chọn số bảng và bấm "Bốc thăm chia bảng" ở phía trên.</p>
          </div>`;
        return;
      }

      grid.innerHTML = (draw.letters || Object.keys(draw.groups)).map(letter => {
        const list = draw.groups[letter] || [];
        return `
          <div class="sc-card rounded-2xl overflow-hidden">
            <div class="bg-white/[0.04] px-4 py-2.5 border-b border-white/10 flex items-center justify-between">
              <span class="font-black text-sm text-orange-400 uppercase">Bảng ${letter}</span>
              <span class="text-[11px] text-slate-400 font-semibold">${list.length} cặp</span>
            </div>
            <div class="p-3.5 space-y-2">
              ${list.map((pair, i) => `
                <div class="bg-[#090b0f] border border-white/10 rounded-xl px-3 py-2 flex items-center justify-between gap-2 text-xs">
                  <div class="flex items-center gap-2 min-w-0">
                    <span class="w-5 h-5 rounded-full bg-white/[0.08] text-amber-300 font-black text-[10px] flex items-center justify-center shrink-0">${i + 1}</span>
                    <span class="font-bold text-white truncate">${pair.name}</span>
                  </div>
                  <span class="text-[10px] text-slate-400 shrink-0">${pair.pairType || ''} • <b class="text-emerald-400">${Number(pair.totalRating || 0).toFixed(1)}</b></span>
                </div>
              `).join('') || '<p class="text-xs text-slate-500 text-center py-3">Trống</p>'}
            </div>
          </div>`;
      }).join('');
    }

    onValue(ref(db, '/'), (snap) => {
      const data = snap.val() || {};
      state.settings = data.settings || {};
      state.doublesTeams = data.doublesTeams || {};
      state.groupDraw = data.groupDraw || null;
      document.getElementById('grpTourName').textContent = state.settings.name || 'Giải Pickleball Bính Dần 1986';
      renderGroups();
    });

    lucide.createIcons();
  </script>
</body>
</html>
